dependencies:
  espressif/cjson: "^1.7.19"
  espressif/esp_codec_dev: "1.5.10"
  espressif/esp_audio_codec: "2.5.0"
  espressif/esp_video:
    version: "2.6.0"
    rules:
      - if: "target in [esp32s3, esp32c6, esp32p4]"
  espressif/esp_new_jpeg:
    version: "^1.0.2"
    rules:
      - if: "target in [esp32, esp32s3]"
  espressif/esp_hosted:
    version: "2.12.11"
    rules:
      - if: "target == esp32p4"
  espressif/esp_wifi_remote:
    version: "1.6.4"
    rules:
      - if: "target == esp32p4"
  espressif/esp_lcd_ili9341:
    version: "2.1.0"
    rules:
      - if: "target in [esp32, esp32s3]"
  atanisoft/esp_lcd_ili9488:
    version: "1.1.1"
    rules:
      - if: "target in [esp32, esp32s3]"
  waveshare/esp_lcd_st7735:
    version: "2.0.0"
    rules:
      - if: "target in [esp32, esp32s3]"
  espressif/elf_loader: "2.0.0"
  espressif/esp_lcd_touch:
    version: "1.2.1"
  espressif/esp_lcd_co5300:
    version: "2.2.0"
    rules:
      - if: "target == esp32s31"
  espressif/esp_lcd_touch_cst9220:
    version: "0.1.1"
    rules:
      - if: "target == esp32s31"
  # SPI NAND flash (GD5F1GM7 on ESP-Mosaico) used as the fixed SD-card-style volume.
  # The FATFS integration and the USB mass-storage path both use the BDL (esp_blockdev) API.
  # override_path: local fork of 1.4.4 with the S31 short-command polling fix from the
  # official ESP-Mosaico BSP (without it, READY status reads hang on S31).
  espressif/spi_nand_flash:
    version: "1.4.4"
    override_path: "../Libraries/espressif__spi_nand_flash"
    rules:
      - if: "target == esp32s31"
  espressif/spi_nand_flash_fatfs:
    version: "1.1.2"
    rules:
      - if: "target == esp32s31"
  atanisoft/esp_lcd_touch_xpt2046:
    version: "1.0.6"
    rules:
      - if: "target in [esp32, esp32s3]"
  espressif/esp_lcd_touch_cst816s: "1.1.2"
  espressif/esp_lcd_touch_gt911: "1.2.1"
  espressif/esp_lcd_touch_ft5x06: "1.0.6~1"
  espressif/esp_lcd_axs15231b: "2.0.2"
  lambage/esp_lcd_touch_ft6336u: "1.0.8"
  espressif/esp_lcd_st7701:
    version: "2.0.2~2"
    rules:
      - if: "target in [esp32s3, esp32p4]"
  espressif/esp_lcd_st7796:
    version: "1.3.4"
    rules:
      - if: "target in [esp32, esp32s3]"
  espressif/esp_lcd_gc9a01: "2.0.4"
  espressif/esp_lcd_sh8601:
    version: "2.0.1~1"
    rules:
      - if: "target in [esp32s3]"
  espressif/esp_lcd_jd9165:
    version: "2.0.2"
    rules:
      # More hardware seems to be supported - enable as needed
      - if: "target in [esp32p4]"
  espressif/esp_lcd_ili9881c:
    version: "1.1.0"
    rules:
      # More hardware seems to be supported - enable as needed
      - if: "target in [esp32p4]"
  espressif/esp_lcd_st7123:
    version: "1.0.2"
    rules:
      # More hardware seems to be supported - enable as needed
      - if: "target in [esp32p4]"
  espressif/esp_lcd_st7121:
    version: "1.0.1"
    rules:
      # More hardware seems to be supported - enable as needed
      - if: "target in [esp32p4]"
  espressif/esp_lcd_touch_st7123:
    version: "1.0.1"
    rules:
      # More hardware seems to be supported - enable as needed
      - if: "target in [esp32p4]"
  espressif/esp_lcd_panel_io_additions: "1.0.1"
  espressif/esp_tinyusb:
    version: "2.4.0"
    rules:
      - if: "target in [esp32s3, esp32p4, esp32s31]"
  espressif/esp_lvgl_port: "2.9.0"
  lvgl/lvgl: "9.6.0~1"
  epdiy:
    git: https://github.com/vroland/epdiy.git
    version: 2.1.3
    rules:
      # More hardware might be supported - enable as needed
      - if: "target in [esp32s3]"
  espressif/usb:
    version: "1.6.0"
    rules:
      - if: "target in [esp32s3, esp32p4, esp32s31]"
  espressif/usb_host_hid:
    version: "1.2.1"
    rules:
      - if: "target in [esp32s3, esp32p4, esp32s31]"
  # USB Audio Class host client: USB headphones/headsets output.
  espressif/usb_host_uac:
    version: "1.5.0"
    rules:
      - if: "target in [esp32s3, esp32p4, esp32s31]"
  espressif/usb_host_msc:
    version: "1.3.0"
    rules:
      - if: "target in [esp32s3, esp32p4, esp32s31]"
  jgromes/radiolib:
    version: "7.7.1"
    rules:
      - if: "target in [esp32, esp32s3, esp32p4]"
  idf: '6.1.0'
