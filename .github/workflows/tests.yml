name: Tests
on:
  push:
    branches:
      - main
  pull_request:
    types: [ opened, synchronize, reopened ]
jobs:
  TactilityTests:
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout repo"
        uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: "Configure Project"
        uses: threeal/cmake-action@v1.3.0
      - name: "Prepare Project"
        run: cmake -S ./ -B build
      - name: "Build Tests"
        run: cmake --build build --target build-tests
      - name: "Run Tests"
        shell: bash
        run: |
          # Prints the output of failing tests only, without the log lines of the kernel and the modules
          ctest --test-dir build/Tests --output-on-failure | grep -v -P '^\x1b\[[0-9;]*m [VDIWE] \('
  DevicetreeTests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive
      - name: "Install Python Dependencies"
        shell: bash
        run: pip install lark==1.3.1 pyyaml==6.0.3
      - name: "Run Devicetree Tests"
        shell: bash
        working-directory: Buildscripts/DevicetreeCompiler/tests
        run: python test_integration.py
