description: Everest Semiconductor ES8388 audio codec (speaker output + line/mic input)

include: ["i2c-device.yaml"]

compatible: "everest,es8388"

properties:
  i2s:
    type: phandle
    required: true
    description: "I2S controller device that carries audio data"
  output-gain-db:
    type: int
    default: 0
    description: |
      Analog gain of all outputs (speaker and headphones) in dB, from -30 to 3 in steps of 1 dB.
      It comes on top of the volume that the audio stream sets. A higher gain is louder but clips earlier.
