description: 5-way GPIO trackball (4 directions + click button)

compatible: "tactility,gpio-trackball"

properties:
  pin-right:
    type: phandles
    required: true
    description: Right-direction GPIO pin
  pin-up:
    type: phandles
    required: true
    description: Up-direction GPIO pin
  pin-left:
    type: phandles
    required: true
    description: Left-direction GPIO pin
  pin-down:
    type: phandles
    required: true
    description: Down-direction GPIO pin
  pin-click:
    type: phandles
    required: true
    description: Click button GPIO pin
  default-mode:
    type: int
    default: TRACKBALL_MODE_KEYBOARD
    description: |
      The type of child device that is created until settings are applied.
      TRACKBALL_MODE_KEYBOARD creates a keyboard (arrow keys and enter), TRACKBALL_MODE_MOUSE creates a mouse.
