description: Ilitek ILI9341 display panel

compatible: "ilitek,ili9341"

bus: spi

properties:
  horizontal-resolution:
    type: int
    required: true
    description: Horizontal resolution in pixels
  vertical-resolution:
    type: int
    required: true
    description: Vertical resolution in pixels
  gap-x:
    type: int
    default: 0
    description: X offset applied to all draw operations
  gap-y:
    type: int
    default: 0
    description: Y offset applied to all draw operations
  swap-xy:
    type: boolean
    default: false
    description: Swap the X and Y axes
  mirror-x:
    type: boolean
    default: false
    description: Mirror the X axis
  mirror-y:
    type: boolean
    default: false
    description: Mirror the Y axis
  invert-color:
    type: boolean
    default: false
    description: Invert the panel's color output
  bgr-order:
    type: boolean
    default: false
    description: Use BGR element order instead of RGB
  bits-per-pixel:
    type: int
    default: 16
    description: Color depth in bits per pixel
  pixel-clock-hz:
    type: int
    default: 40000000
    description: SPI pixel clock frequency in Hz
  transaction-queue-depth:
    type: int
    default: 10
    description: Size of the internal SPI transaction queue
  gamma-curve:
    type: int
    default: 1
    min: 0
    max: 3
    description: Gamma curve preset index [0,3], sent via the MIPI DCS GAMSET (0x26) command at bring-up
  pin-dc:
    type: phandles
    required: true
    description: Data/Command GPIO pin
  pin-reset:
    type: phandles
    default: GPIO_PIN_SPEC_NONE
    description: Reset GPIO pin
  reset-active-high:
    type: boolean
    default: false
    description: Whether the reset pin is active high
  init-sequence:
    type: array
    element-type: uint8_t
    description: >
      Custom vendor bring-up sequence, flattened into bytes as a run of
      [cmd, data-length, delay-ms, data-length bytes of data...] entries, e.g.
      `init-sequence = [0xC0 1 0  0x10  0xC5 2 0  0x30 0x30];`.
      It replaces the ILI9341 component's built-in power, VCOM and gamma settings, for panels
      that need their own. Sleep out, MADCTL and COLMOD are sent before it, and color
      inversion, the gamma curve and display on after it, so leave those out.
      Omit to use the component's built-in default sequence.
  backlight:
    type: phandle
    default: "NULL"
    description: Optional reference to this display's backlight device
