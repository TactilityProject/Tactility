description: >
  LILYGO T5 4.7 Inch E-Paper S3 (V2.3/V2.4) display with an ED047TC1 panel, driven in 16 shades with a dose of
  frames per pixel instead of waveform tables. Updates do not block and leave no trails on gray backgrounds.
  The pins of the panel are fixed in the driver, so this node only has the pixel clock as property.

compatible: "lilygo,t5s3-display"

properties:
  pixel-clock-hz:
    type: int
    default: 20000000
    description: >
      Clock of the bus that sends the pixel data of a row. The doses of the shades were measured with 20 MHz,
      which lets a frame of all rows fit in its period.
