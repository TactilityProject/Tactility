description: FocalTech FT3168 capacitive touch controller (up to 2 touch points)

include: ["i2c-device.yaml"]

compatible: "focaltech,ft3168"

bus: i2c

properties:
  x-max:
    type: int
    required: true
    description: Maximum X coordinate of the panel (typically the horizontal resolution)
  y-max:
    type: int
    required: true
    description: Maximum Y coordinate of the panel (typically the vertical resolution)
  swap-xy:
    type: boolean
    default: false
    description: Swap the X and Y axes
  mirror-x:
    type: boolean
    default: false
    description: Mirror the X axis
  mirror-y:
    type: boolean
    default: false
    description: Mirror the Y axis
  pin-reset:
    type: phandles
    default: GPIO_PIN_SPEC_NONE
    description: Optional reset GPIO pin
