general.vendor=M5Stack
general.name=Cardputer,Cardputer v1.1

cdn.warningMessage=This device has very little available RAM. App Hub is likely to crash. Install apps by copying them to the SD card and install them via the Files app.

hardware.target=ESP32S3
hardware.flashSize=8MB
hardware.spiRam=false
hardware.tinyUsbMsc=true
hardware.esptoolFlashFreq=120M
hardware.bluetooth=true

storage.path=/sdcard

display.size=1.14"
# HACK: dps is actually 242, but this breaks UI (button selection becomes invisible and switch visibility is reduced)
display.dpi=139

lvgl.colorDepth=16
lvgl.uiSpacing=20
lvgl.uiSize=0

# 5 lines is bad for performance, but we can squeeze about 3 kB of RAM from this
# (as opposed to default 10% of vres = 13 lines)
lvgl.drawBufferLines=5
# Save 3.5 kB
lvgl.fsCacheSize=512

sdkconfig.CONFIG_CODEC_DUMMY_SUPPORT=y

# Wi-Fi / network stack memory saving (defaults to 16)
sdkconfig.CONFIG_LWIP_MAX_SOCKETS=8
sdkconfig.CONFIG_LWIP_MAX_ACTIVE_TCP=8
sdkconfig.CONFIG_LWIP_MAX_LISTENING_TCP=8
sdkconfig.CONFIG_LWIP_MAX_UDP_PCBS=8
sdkconfig.CONFIG_LWIP_MAX_RAW_PCBS=8
