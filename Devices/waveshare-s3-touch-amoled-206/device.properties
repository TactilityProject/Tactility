general.vendor=Waveshare
general.name=S3 Touch AMOLED 2.06"
general.incubating=true

hardware.target=ESP32S3
hardware.flashSize=32MB
hardware.spiRam=true
hardware.spiRamMode=OCT
hardware.spiRamSpeed=120M
hardware.tinyUsbMsc=true
hardware.esptoolFlashFreq=120M
hardware.bluetooth=true

storage.userDataLocation=Internal

display.size=2.06"
display.shape=rectangle
display.dpi=326

lvgl.colorDepth=16
lvgl.fontSize=22

sdkconfig.CONFIG_TASK_WDT_TIMEOUT_S=10
sdkconfig.CONFIG_SPIRAM_MALLOC_RESERVE_INTERNAL=131072
# LVGL v9 symbol (v8 was LV_DISP_DEF_REFR_PERIOD). Upstream moved this out of device.py,
# so pin it per-device: 10ms keeps the panel above the 16ms animation tick.
sdkconfig.CONFIG_LV_DEF_REFR_PERIOD=10
# Drive the screensaver animation at the panel's refresh rate instead of the generic 50ms.
sdkconfig.CONFIG_TT_DISPLAY_IDLE_TICK_MS=16
