general.vendor=Espressif
general.name=ESP32-S31-Korvo-1
general.incubating=true

hardware.target=ESP32S31
hardware.flashSize=16MB
hardware.spiRam=true
hardware.spiRamMode=OCT
hardware.spiRamSpeed=250M
hardware.tinyUsbMsc=true
# ESP-IDF 6.1's S31 flash driver only exposes 20/40/80 MHz.
hardware.esptoolFlashFreq=80M
hardware.bluetooth=true

storage.path=/sdcard

display.size=4.3"
display.dpi=216

lvgl.colorDepth=16
lvgl.fontSize=18
lvgl.uiSpacing=60
lvgl.uiSize=80

# The flasher stub runs on S31. The ROM-only path is roughly an order of magnitude slower.
sdkconfig.CONFIG_ESPTOOLPY_NO_STUB=n
