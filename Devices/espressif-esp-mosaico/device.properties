general.vendor=Espressif
general.name=ESP-Mosaico
general.incubating=true

hardware.target=ESP32S31
hardware.flashSize=16MB
hardware.spiRam=true
hardware.spiRamMode=OCT
hardware.spiRamSpeed=250M
hardware.tinyUsbMsc=true
# CDC-ACM console on the Type-C port: the board has no SD card, so no primary class claims the
# USB slot at boot, and USB-Serial/JTAG is only wired to the left expansion header.
hardware.tinyUsbCdc=true
# ESP-IDF 6.1's S31 flash driver only exposes 20/40/80 MHz.
hardware.esptoolFlashFreq=80M
hardware.bluetooth=true
# Boot confirmation buzz; uses the configured Vibration strength and is skipped when vibration
# is disabled there.
sdkconfig.CONFIG_TT_VIBRATION_ON_BOOT=y

# The S31 USB-OTG download port has no DTR/RTS reset wiring. Enter download mode first (hold
# BOOT while resetting, or send TT:BOOTDL on the console), then let esptool flash without trying
# to reset the target, which would only re-enumerate and drop the port.
sdkconfig.CONFIG_ESPTOOLPY_BEFORE_NORESET=y
# The flasher stub runs on S31. The ROM-only path is roughly an order of magnitude slower.
sdkconfig.CONFIG_ESPTOOLPY_NO_STUB=n

storage.userDataLocation=SD

display.size=2.16"
display.shape=rounded
display.dpi=314

lvgl.colorDepth=16
lvgl.fontSize=18
lvgl.uiSpacing=20
lvgl.uiSize=60

ui.systemBarsPortrait=split
ui.systemBarsLandscape=split

# The NAND volume is exposed both to FatFS and to USB mass storage, which needs the
# wear-levelled block-device handle from the driver.
sdkconfig.CONFIG_NAND_FLASH_ENABLE_BDL=y

# FatFS must accept 2048-byte sectors: the NAND diskio layer maps one FAT sector to one NAND
# page. FF_MAX_SS is MAX(FF_SS_SDCARD, CONFIG_WL_SECTOR_SIZE), so raise the WL sector size.
# The NOR wear-levelling /data partition is unused on this board (storage.userDataLocation=SD).
sdkconfig.CONFIG_WL_SECTOR_SIZE_4096=y
sdkconfig.CONFIG_WL_SECTOR_SIZE=4096

# The CO5300 streams LVGL draw buffers from PSRAM through SPI DMA. Align them to the S31 D-cache
# line so cache maintenance and DMA agree on whole lines.
sdkconfig.CONFIG_LV_DRAW_BUF_ALIGN=64
sdkconfig.CONFIG_LV_DEF_REFR_PERIOD=15
# Used by the official BSP examples; keeps the RISC-V hot path out of the relatively slow flash.
sdkconfig.CONFIG_SPIRAM_XIP_FROM_PSRAM=y
